<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How one piece of work flows through the company engine</title>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b4a3a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9b8a3; stroke-width: 1.5; }
      .fence { fill: #fff6f4; stroke: #c25b4f; stroke-width: 1.8; stroke-dasharray: 7 4; }
      .you { fill: #f6e3c8; stroke: #b9752b; stroke-width: 1.5; }
      .n { fill: #8a5a1f; font-size: 13px; font-weight: 700; }
      .t { fill: #2b2118; font-size: 15px; font-weight: 600; }
      .s { fill: #5b4a3a; font-size: 12px; }
      .line { stroke: #5b4a3a; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="980" height="300" fill="#fbf8f3"/>

  <rect x="16" y="40" width="172" height="150" rx="12" class="you"/>
  <text x="32" y="64" class="n">1</text>
  <text x="32" y="86" class="t">You give a task</text>
  <text x="32" y="108" class="s">in your own words on the</text>
  <text x="32" y="124" class="s">Map, from a job, or to one</text>
  <text x="32" y="140" class="s">agent with @. Tick "Plan</text>
  <text x="32" y="156" class="s">first" for anything big.</text>

  <rect x="210" y="40" width="172" height="150" rx="12" class="box"/>
  <text x="226" y="64" class="n">2</text>
  <text x="226" y="86" class="t">Chief of staff</text>
  <text x="226" y="108" class="s">sizes it and hands it out</text>
  <text x="226" y="124" class="s">on the board. A plan-first</text>
  <text x="226" y="140" class="s">task waits until you</text>
  <text x="226" y="156" class="s">accept the plan.</text>

  <rect x="404" y="40" width="172" height="150" rx="12" class="fence"/>
  <text x="420" y="64" class="n">3</text>
  <text x="420" y="86" class="t">An agent works</text>
  <text x="420" y="108" class="s">inside the fence: its own</text>
  <text x="420" y="124" class="s">task folder, your files to</text>
  <text x="420" y="140" class="s">read, the board only</text>
  <text x="420" y="156" class="s">through the gate.</text>

  <rect x="598" y="40" width="172" height="150" rx="12" class="fence"/>
  <text x="614" y="64" class="n">4</text>
  <text x="614" y="86" class="t">The Checker</text>
  <text x="614" y="108" class="s">checks it, pass or fail with</text>
  <text x="614" y="124" class="s">a reason for each point.</text>
  <text x="614" y="140" class="s">After five failed rounds</text>
  <text x="614" y="156" class="s">it stops and asks you.</text>

  <rect x="792" y="40" width="172" height="150" rx="12" class="you"/>
  <text x="808" y="64" class="n">5</text>
  <text x="808" y="86" class="t">Needs you</text>
  <text x="808" y="108" class="s">Accept, or Send back with</text>
  <text x="808" y="124" class="s">a note. A draft becomes</text>
  <text x="808" y="140" class="s">final only when you accept.</text>
  <text x="808" y="156" class="s">Nothing is sent out.</text>

  <line x1="188" y1="115" x2="206" y2="115" class="line" marker-end="url(#b)"/>
  <line x1="382" y1="115" x2="400" y2="115" class="line" marker-end="url(#b)"/>
  <line x1="576" y1="115" x2="594" y2="115" class="line" marker-end="url(#b)"/>
  <line x1="770" y1="115" x2="788" y2="115" class="line" marker-end="url(#b)"/>

  <!-- fail loop between checker and agent -->
  <path d="M684,40 C684,14 490,14 490,36" class="line" marker-end="url(#b)"/>
  <text x="587" y="22" text-anchor="middle" class="s">fails: the agent tries again</text>

  <!-- send back loop -->
  <path d="M878,190 C878,250 490,250 490,194" class="line" marker-end="url(#b)"/>
  <text x="684" y="246" text-anchor="middle" class="s">Send back: the task reopens with your note</text>

  <text x="16" y="284" class="s">Anything that costs money (a film, an app's spending) waits for your approval on the Mac, inside the daily and monthly limits you set.</text>
</svg>
