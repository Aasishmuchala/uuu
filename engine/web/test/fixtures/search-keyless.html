<!-- Written by hand to the shape PLAN-V5 K11 describes for a keyless HTML results page
     (a.result__a with a /l/?uddg= redirect, then .result__snippet). It is NOT a copy of a live page. -->
<html><head><title>architecture at DuckDuckGo</title><style>.result__a { color: blue }</style></head>
<body>
<div class="serp__results"><div class="results">
  <div class="result results_links results_links_deep web-result">
    <h2 class="result__title"><a rel="nofollow" class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.org%2Farch%3Fa%3D1%26b%3D2&amp;rut=abc123">Software <b>architecture</b> &amp; design</a></h2>
    <a class="result__snippet" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fexample.org%2Farch&amp;rut=abc123">How systems are <b>shaped</b> &mdash; a short guide.</a>
  </div>
  <div class="result results_links results_links_deep web-result">
    <h2 class="result__title"><a rel="nofollow" class="result__a" href="https://plain.example.net/page">A link that is not wrapped</a></h2>
    <div class="result__snippet">Second snippet,
      on two lines.</div>
  </div>
  <div class="result results_links results_links_deep web-result">
    <h2 class="result__title"><a class="result__a" href="//duckduckgo.com/l/?uddg=https%3A%2F%2Fthird.example.com%2F">Third result</a></h2>
    <a class="result__snippet" href="#">Third snippet.</a>
  </div>
</div></div>
</body></html>
